<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agentic MDS — Executive briefing</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root {
      --navy: #0b1f3a;
      --gold: #c4a35a;
      --teal: #0f6e6e;
      --off: #f5f7f9;
      --slate: #3a4758;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Calibri, "Segoe UI", system-ui, sans-serif;
      background: var(--navy);
      color: #fff;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 20px;
      border-bottom: 2px solid var(--gold);
      background: #0b1f3a;
    }
    .mark {
      color: var(--gold);
      font-size: 12px;
      letter-spacing: .08em;
      font-weight: 700;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    a.btn, button.btn {
      appearance: none;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      padding: 7px 12px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 13px;
      cursor: pointer;
    }
    a.btn.primary, button.btn.primary {
      background: var(--gold);
      color: var(--navy);
      font-weight: 700;
    }
    main {
      height: calc(100% - 92px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .stage {
      width: min(100%, 1280px);
      aspect-ratio: 16 / 9;
      background: #000;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      position: relative;
    }
    .stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #fff;
    }
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px 12px;
      font-size: 13px;
      color: #c5d0dc;
    }
    .nav { display: flex; gap: 8px; align-items: center; }
    .hint { opacity: .75; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="mark">Internal confidential · 20-minute decision briefing</div>
      <h1>Own the IMDS desk. Build the agentic workflow.</h1>
    </div>
    <div class="actions">
      <a class="btn primary" href="IMDS_Agentic_Workflow.pptx">Download PowerPoint</a>
      <a class="btn" href="IMDS_Agentic_Workflow.pdf">Download PDF</a>
      <a class="btn" href="IMDS_Agentic_Workflow_Demo.mp4">Watch UI demo</a>
    </div>
  </header>
  <main>
    <div class="stage">
      <img id="slide" alt="Briefing slide" />
    </div>
  </main>
  <footer>
    <div>Supplier Quality Director · GM · VW · Ford · Tier-1 and Tier-2</div>
    <div class="nav">
      <button class="btn" id="prev" type="button">← Prev</button>
      <span id="counter">1 / 13</span>
      <button class="btn" id="next" type="button">Next →</button>
    </div>
    <div class="hint">Arrow keys · Home/End · F for fullscreen</div>
  </footer>
  <script>
    const TOTAL = 13;
    let i = 1;
    const img = document.getElementById("slide");
    const counter = document.getElementById("counter");
    function pad(n) { return String(n).padStart(2, "0"); }
    function show(n) {
      i = Math.min(TOTAL, Math.max(1, n));
      img.src = "slides/slide-" + pad(i) + ".png";
      counter.textContent = i + " / " + TOTAL;
      history.replaceState(null, "", "#" + i);
    }
    document.getElementById("prev").onclick = () => show(i - 1);
    document.getElementById("next").onclick = () => show(i + 1);
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); show(i + 1); }
      if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(i - 1); }
      if (e.key === "Home") show(1);
      if (e.key === "End") show(TOTAL);
      if (e.key === "f" || e.key === "F") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
    });
    const fromHash = parseInt((location.hash || "#1").slice(1), 10);
    show(Number.isFinite(fromHash) ? fromHash : 1);
  </script>
</body>
</html>
